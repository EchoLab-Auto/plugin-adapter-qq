[workspace]
resolver = "2"
members = [
    "crates/echo-core",
    "crates/echo-server",
    "crates/echo-adapter-qq",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/EchoLab-Auto/plugin-adapter-qq"

# 版本与 EchoAgentCore 根 Cargo.toml 保持一致（迁出期同步，避免行为漂移）。
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
chrono = "0.4"
sha2 = "0.10"
regex = "1"
